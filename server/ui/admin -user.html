<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    section { margin-bottom: 40px; }
    h2 { border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    form { margin-top: 10px; }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 15px; padding: 10px 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f5f5f5; }
    .actions button { margin-right: 5px; }
  </style>
</head>
<body>

  <!-- ➕ Create User -->
  <section>
    <h2>➕ Create User</h2>
    <form id="createUserForm">
      <label for="name">Name:</label>
      <input type="text" id="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" required>

      <label for="password">Password:</label>
      <input type="password" id="password" required>

      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" required>

      <label for="role">Role:</label>
      <select id="role" onchange="handleRoleChange()" required>
        <option value="">-- Select Role --</option>
        <option value="admin">Admin</option>
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
      </select>

      <div id="classField" style="display: none;">
        <label for="class">Class:</label>
        <input type="text" id="class" placeholder="e.g., 10-A">
      </div>

      <div id="subjectsField" style="display: none;">
        <label for="subjects">Subjects (comma-separated):</label>
        <input type="text" id="subjects" placeholder="e.g., Math, Science">
      </div>

      <button type="submit">Create User</button>
    </form>
  </section>

  <!-- 🗒️ Users List with Filters -->
  <section>
    <h2>🗒️ Users List (Search Options)</h2>

    <label for="emailSearch">Search by Email:</label>
    <input type="text" id="emailSearch" placeholder="Enter full email..." oninput="applyFilters()" />

    <label for="classSearch">Filter by Class:</label>
    <input type="text" id="classSearch" placeholder="Enter class (e.g., 11-A, 10-B)" oninput="applyFilters()" />

    <table id="usersTable">
      <thead>
        <tr>
          <th>User ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Class</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="userRows">
        <!-- Filtered users will be displayed here -->
      </tbody>
    </table>
  </section>

  <!-- 📤 Bulk Upload Users -->
  <section>
    <h2>📤 Bulk Upload Users (CSV)</h2>
    <form id="uploadCSVForm" enctype="multipart/form-data">
      <label for="csvFile">Select CSV File:</label>
      <input type="file" id="csvFile" accept=".csv" required>
      <button type="submit">Upload</button>
    </form>
  </section>

  <script>
    // Sample user data with class
    const allUsers = Array.from({ length: 20 }, (_, i) => ({
      id: 1000 + i,
      name: `User ${i + 1}`,
      email: `user${i + 1}@example.com`,
      role: ['admin', 'teacher', 'student'][i % 3],
      class: ['11-A', '10-B', '9-C'][i % 3],
      status: 'Active'
    }));

    const tbody = document.getElementById('userRows');

    function renderUsers(users) {
      if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7">No users found.</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(user => `
        <tr>
          <td>${user.id}</td>
          <td>${user.name}</td>
          <td>${user.email}</td>
          <td>${user.role}</td>
          <td>${user.class}</td>
          <td>${user.status}</td>
          <td>
            <button onclick="deactivateUser('${user.name}')">Deactivate</button>
            <button onclick="deleteUser('${user.name}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function applyFilters() {
      const emailVal = document.getElementById('emailSearch').value.trim().toLowerCase();
      const classVal = document.getElementById('classSearch').value.trim().toLowerCase();

      const filtered = allUsers.filter(u => {
        const emailMatch = emailVal === "" || u.email.toLowerCase() === emailVal;
        const classMatch = classVal === "" || u.class.toLowerCase() === classVal;
        return emailMatch && classMatch;
      });

      renderUsers(filtered);
    }

    function handleRoleChange() {
      const role = document.getElementById('role').value;
      const classField = document.getElementById('classField');
      const subjectsField = document.getElementById('subjectsField');

      if (role === 'student') {
        classField.style.display = 'block';
        subjectsField.style.display = 'block';
      } else if (role === 'teacher') {
        classField.style.display = 'none';
        subjectsField.style.display = 'block';
      } else {
        classField.style.display = 'none';
        subjectsField.style.display = 'none';
      }
    }

    function deactivateUser(name) {
      alert(`Deactivated ${name}`);
    }

    function deleteUser(name) {
      if (confirm(`Delete ${name}?`)) {
        alert(`${name} deleted`);
      }
    }

    // Initial render
    renderUsers(allUsers);
  </script>

</body>
</html>
