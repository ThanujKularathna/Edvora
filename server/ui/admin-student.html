<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 {
      margin-bottom: 20px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }
    section {
      margin-bottom: 40px;
    }
    form {
      margin-top: 10px;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.05);
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      box-sizing: border-box;
    }
    button {
      margin-top: 15px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .info-box {
      margin-top: 10px;
      background: #eef;
      padding: 10px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <h2>🎓 Student Management</h2>

  <!-- 🔍 Search Student by Email -->
  <section>
    <h3>🔍 Search Student</h3>
    <form id="searchForm">
      <label for="studentEmail">Student Email:</label>
      <input type="email" id="studentEmail" placeholder="e.g., student@mail.com" required>
      <button type="submit">Search</button>
    </form>
    <div id="studentInfo" class="info-box" style="display:none;">
      <strong>Name:</strong> John Doe<br>
      <strong>Current Class:</strong> 10-A<br>
      <strong>Subjects:</strong> Math, Science
    </div>
  </section>

  <!-- ➕ Add Student to Class -->
  <section>
    <h3>➕ Add Student to a Class</h3>
    <form onsubmit="assignClass(event)">
      <label for="addClassEmail">Student Email:</label>
      <input type="email" id="addClassEmail" required placeholder="e.g., student@mail.com" />

      <label for="gradeSelect">Select Grade:</label>
      <select id="gradeSelect" onchange="updateClassPreview()" required>
        <option value="">-- Select Grade --</option>
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
        <option value="11">Grade 11</option>
      </select>

      <label for="sectionSelect">Select Section:</label>
      <select id="sectionSelect" onchange="updateClassPreview()" required>
        <option value="">-- Select Section --</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
      </select>

      <div id="classPreview" style="margin-top: 10px; font-weight: bold;"></div>

      <button type="submit">Assign to Class</button>
    </form>
  </section>

  <!-- ❌ Remove Student from Class -->
  <section>
    <h3>❌ Remove Student from a Class</h3>
    <form onsubmit="removeFromClass(event)">
      <label for="removeEmail">Student Email:</label>
      <input type="email" id="removeEmail" required placeholder="e.g., student@mail.com">
      <button type="submit">Remove from Class</button>
    </form>
  </section>

  <!-- 📚 Add Subjects to Student -->
  <section>
    <h3>📚 Add Subject(s) to Student</h3>
    <form onsubmit="addSubjects(event)">
      <label for="subjectEmail">Student Email:</label>
      <input type="email" id="subjectEmail" required placeholder="e.g., student@mail.com">

      <label for="subjectInput">Subjects (comma-separated):</label>
      <input type="text" id="subjectInput" placeholder="e.g., Math, English, History" required>

      <button type="submit">Add Subjects</button>
    </form>
  </section>

  <!-- ➖ Remove Subject from Student -->
  <section>
    <h3>➖ Remove Subject(s) from Student</h3>
    <form onsubmit="removeSubjects(event)">
      <label for="removeSubjectEmail">Student Email:</label>
      <input type="email" id="removeSubjectEmail" required placeholder="e.g., student@mail.com">

      <label for="removeSubjectInput">Subjects to Remove (comma-separated):</label>
      <input type="text" id="removeSubjectInput" placeholder="e.g., History, Art" required>

      <button type="submit">Remove Subjects</button>
    </form>
  </section>

  <script>
    function updateClassPreview() {
      const grade = document.getElementById('gradeSelect').value;
      const section = document.getElementById('sectionSelect').value;
      const preview = document.getElementById('classPreview');

      if (grade && section) {
        preview.innerText = `Selected Class: ${grade}-${section}`;
      } else {
        preview.innerText = '';
      }
    }

    function assignClass(event) {
      event.preventDefault();
      const email = document.getElementById('addClassEmail').value.trim();
      const grade = document.getElementById('gradeSelect').value;
      const section = document.getElementById('sectionSelect').value;

      if (!email || !grade || !section) {
        alert("Please fill all fields.");
        return;
      }

      const className = `${grade}-${section}`;
      alert(`Assigned ${email} to class ${className}`);
    }

    function removeFromClass(event) {
      event.preventDefault();
      const email = document.getElementById('removeEmail').value.trim();
      if (!email) {
        alert("Please enter student email.");
        return;
      }
      alert(`Removed ${email} from class.`);
    }

    function addSubjects(event) {
      event.preventDefault();
      const email = document.getElementById('subjectEmail').value.trim();
      const subjects = document.getElementById('subjectInput').value.trim();
      if (!email || !subjects) {
        alert("Please fill all fields.");
        return;
      }
      alert(`Added subjects to ${email}: ${subjects}`);
    }

    function removeSubjects(event) {
      event.preventDefault();
      const email = document.getElementById('removeSubjectEmail').value.trim();
      const subjects = document.getElementById('removeSubjectInput').value.trim();
      if (!email || !subjects) {
        alert("Please fill all fields.");
        return;
      }
      alert(`Removed subjects from ${email}: ${subjects}`);
    }

    document.getElementById('searchForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const info = document.getElementById('studentInfo');
      info.style.display = 'block';
    });
  </script>

</body>
</html>
